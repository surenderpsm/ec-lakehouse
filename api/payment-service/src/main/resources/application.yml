server:
  port: ${PORT:8086}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:ec}
    password: ${DB_PASSWORD:ec}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # access tokens are signed by auth-service; its public key is fetched from here
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ec:
  payment:
    # marketplace fee kept from each vendor's share
    commission-rate: ${PAYMENT_COMMISSION_RATE:0.10}
    fake:
      # the fake provider declines any payment above this amount, so the failure path can be tried
      decline-above: ${PAYMENT_FAKE_DECLINE_ABOVE:10000}

# Swagger UI at /swagger-ui.html; set API_DOCS_ENABLED=false in production
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
